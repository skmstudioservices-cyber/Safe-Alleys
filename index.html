<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Safe-Alleys — Safety Map of India</title>
<meta name="description" content="Tap the map to see the DIGIPIN of any spot in India. Free, private, no login. Community safety reports coming soon — colour-coded like a traffic map.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://safealleys.pages.dev/">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="Safe-Alleys — Safety Map of India">
<meta property="og:description" content="Free, private, no login. Tap the map — see the DIGIPIN of any spot. Community safety reports coming soon.">
<meta property="og:type" content="website">
<meta name="google-site-verification" content="GlkDu5ZL-CyyKjwPSj9d9X3Y2qsHUj_qAwRwxiLr7nI">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/style.css">
</head>
<body class="app-mode">

<div id="map" role="application" aria-label="Safety map of India"></div>

<header class="hud-top">
  <div class="brand">
    <img src="/icons/icon-192.png" alt="" width="30" height="30">
    <strong>Safe-Alleys</strong>
  </div>
  <div class="hud-actions">
    <button id="lang-btn" class="hud-btn" aria-label="भाषा / Language">हिं</button>
    <button id="install-btn" class="hud-btn hidden" aria-label="Install app">📲</button>
  </div>
</header>

<button id="advisory" class="advisory-chip" aria-expanded="false">
  <span class="chip-short" data-en="⚠️ No data ≠ safe" data-hi="⚠️ डेटा नहीं = सुरक्षित नहीं">⚠️ No data ≠ safe</span>
  <span class="chip-full hidden" data-en="⚠️ We never mark any place “safe”. We only show where people report feeling unsafe. No reports = not enough data. Emergency? Call 112." data-hi="⚠️ हम किसी जगह को “सुरक्षित” नहीं कहते। केवल रिपोर्ट दिखाते हैं। आपात में 112 पर कॉल करें।">⚠️ We never mark any place “safe”. We only show where people report feeling unsafe. No reports = not enough data. Emergency? Call 112.</span>
</button>

<button id="legend" class="legend-pill" aria-expanded="false">
  <span class="chip-short">🟡🟠🔴 <span data-en="Meaning" data-hi="अर्थ">Meaning</span></span>
  <span class="chip-full hidden">
    <span class="lg"><i class="sw grey"></i><span data-en="Not enough data" data-hi="पर्याप्त डेटा नहीं">Not enough data</span></span>
    <span class="lg"><i class="sw yellow"></i><span data-en="Some reports" data-hi="कुछ रिपोर्ट">Some reports</span></span>
    <span class="lg"><i class="sw orange"></i><span data-en="Medium" data-hi="मध्यम">Medium</span></span>
    <span class="lg"><i class="sw red"></i><span data-en="High" data-hi="अधिक">High</span></span>
    <span class="lg-note" data-en="Never green — no place is called “safe”." data-hi="कभी हरा नहीं — कोई जगह “सुरक्षित” नहीं कहलाती।">Never green — no place is called “safe”.</span>
  </span>
</button>

<div class="dock" role="navigation">
  <a href="/about.html" class="dock-btn" aria-label="About">
    <span class="ico">ℹ️</span><span class="lbl" data-en="About" data-hi="जानकारी">About</span>
  </a>
  <button id="report-fab" class="fab" aria-label="Report a spot">
    <span class="ico">➕</span><span class="lbl" data-en="Report" data-hi="रिपोर्ट">Report</span>
  </button>
  <button id="locate-btn" class="dock-btn" aria-label="My location">
    <span class="ico">🎯</span><span class="lbl" data-en="My area" data-hi="मेरा इलाका">My area</span>
  </button>
</div>

<div id="sheet" class="sheet" aria-hidden="true">
  <div class="sheet-handle" aria-hidden="true"></div>
  <div id="sheet-content"></div>
  <button class="sheet-close" aria-label="Close">✕</button>
</div>

<div id="ios-hint" class="ios-hint hidden" data-en="📱 Install: Share → Add to Home Screen" data-hi="📱 इंस्टॉल: Share → Add to Home Screen">📱 Install: Share → Add to Home Screen</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/app.js"></script>
</body>
</html>
